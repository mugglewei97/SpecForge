# Converted from the 8-GPU train_dspark.py server job.
model:
  target_model_path: /personal/model/Qwen3-8B
  draft_checkpoint_path: /mnt/amed-s1/common/ckpt/gaochang/EagleModel/outputs/qwen3-8b-dspark-120w-mix/epoch_6_step_228768
  draft_model_config: ./configs/qwen3-8b-dspark.json
data:
  train_data_path: /mnt/amed-s1/common/data/gaochang/eagle-data/qwen3-8b-regen-mix-70w.jsonl
  max_prompt_length: 4096
  max_length: 8192  # Prompt + generated output; reserve anchor/candidate room.
  chat_template: qwen
  # Non-thinking mode: suppress reasoning tokens during rollout.
  chat_template_kwargs:
    enable_thinking: false
training:
  output_dir: /ossfs/workspace/opd
  num_epochs: 1
  batch_size: 32  # Original per-GPU batch 4 * 8 GPUs; global in this entrypoint.
  learning_rate: 6e-4
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  replay_max_tv: 10.0
  attention_backend: sdpa
  log_interval: 10
  save_interval: 100
  fsdp_sharding: SHARD_GRAD_OP
  # Keep all proposal/context/acceptance JSON. Release p/q/features after the
  # synchronized update; retaining full-vocabulary tensors for 6 epochs is huge.
  retain_replay_tensors: false
rollout:
  placement: colocated
  cuda_devices: [0, 1, 2, 3, 4, 5, 6, 7]
  mem_fraction_static: 0.3
  context_length: 10000  # 3072 visible tokens + verification scratch space.
  attention_backend: flashinfer
sampling:
  # New on-policy sampling choices; the old supervised command had no sampler.
  temperature: 1.0
  top_k: -1
  top_p: 1.0
  max_new_tokens: 4096  # Per request, capped to 3072 - prompt_length.
  ignore_eos: false